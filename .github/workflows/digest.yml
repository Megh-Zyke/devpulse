name: Daily DevPulse Digest

on:
  schedule:
    # 8:00 AM ET = 12:00 UTC (EDT, Mar-Nov) / 13:00 UTC (EST, Nov-Mar).
    # GitHub Actions cron doesn't follow DST, so this drifts to ~7am ET in winter.
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DevPulse
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TOPICS: ${{ vars.TOPICS }}
          REPOS: ${{ vars.REPOS }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python run.py

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest_*.md
